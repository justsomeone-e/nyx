name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "HolyEasyLang ${{ github.ref_name }} (Public Release)"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          body: |
            ## ⚡ HolyEasyLang ${{ github.ref_name }}

            Next-Generation Multi-Target Systems & Application Programming Language.

            ### 🚀 What's New in This Release
            * **Multi-Backend Compilation**:
              * `hecpp`: ISO C++20 backend frozen at Gate 8 (Production Native `.exe` via LLVM Clang / GCC).
              * `hejs`: Node.js ES2022 backend frozen at Gate 8.
              * `hepy`: Canonical reference evaluation engine.
              * `hers`: Rust 2021 active conformance backend (Gate 6).
            * **Module & Dependency Resolution**:
              * Full topological import graph (`import "./file"`, `import "std/math"`).
              * Diamond dependency deduplication & `E1302` ambiguous symbol resolution.
            * **Rustc-Grade Diagnostics v2**:
              * Visual caret spans (`^^^^`), source paths, note annotations, and `help:` hints.
            * **Integrated Developer Tooling & LSP v2**:
              * Language Server Protocol v2 (`completion`, `hover`, `definition`, `diagnostics`).
              * Multi-command CLI (`new`, `check`, `build`, `run`, `test`, `doctor`, `fmt`).
            * **Branding & Visuals**:
              * Minimalist obsidian black vector logo & favicon.

            ### 📦 Quick Automated Installation

            **Windows (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/k4chox/HolyEasyLang/main/install.ps1 | iex
            ```

            **Linux / macOS (Bash):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/k4chox/HolyEasyLang/main/install.sh | bash
            ```

            ---
            *For full documentation, visit [README.md](https://github.com/k4chox/HolyEasyLang).*
          generate_release_notes: true
