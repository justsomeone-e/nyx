name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: nyx-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches VERSION
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '\r\n' < VERSION)"

      - name: Set up native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang build-essential

      - name: Install and verify VS Code extension dependencies
        working-directory: vscode-extension
        run: |
          npm ci --ignore-scripts
          npm test
          mkdir -p ../dist
          npm run package -- --out "../dist/nyx-language-support-${{ github.ref_name }}.vsix"

      - name: Upload VS Code extension package
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 1

      - name: Execute Full Universal Test Suite
        run: python -u tests/run_all_tests.py

  native-compiler:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: nyxc-linux-x86_64
          - os: windows-latest
            asset: nyxc-windows-x86_64.exe
          - os: macos-15-intel
            asset: nyxc-macos-x86_64
          - os: macos-latest
            asset: nyxc-macos-arm64
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Windows LLVM toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command clang++ -ErrorAction SilentlyContinue)) {
            choco install llvm --no-progress -y
          }

      - name: Ensure Linux C++20 toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang build-essential

      - name: Build and smoke-test native compiler (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          python -u src/cli.py self-host build -o "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          "dist/${{ matrix.asset }}" --version
          printf '%s\n' 'fn main() { print(42); }' > dist/native-smoke.nyx
          "dist/${{ matrix.asset }}" check dist/native-smoke.nyx
          "dist/${{ matrix.asset }}" compile dist/native-smoke.nyx -o dist/native-smoke
          test "$(dist/native-smoke)" = "42"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          fi

      - name: Build and smoke-test native compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          python -u src/cli.py self-host build -o "dist/${{ matrix.asset }}"
          & "dist/${{ matrix.asset }}" --version
          if ($LASTEXITCODE -ne 0) { throw "Native compiler version probe failed." }
          [IO.File]::WriteAllText("dist/native-smoke.nyx", "fn main() { print(42); }`n", [Text.UTF8Encoding]::new($false))
          & "dist/${{ matrix.asset }}" check "dist/native-smoke.nyx"
          if ($LASTEXITCODE -ne 0) { throw "Native compiler check smoke test failed." }
          & "dist/${{ matrix.asset }}" compile "dist/native-smoke.nyx" -o "dist/native-smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "Native compiler build smoke test failed." }
          $output = & "dist/native-smoke.exe"
          if ($LASTEXITCODE -ne 0 -or $output.Trim() -ne "42") { throw "Native compiler runtime smoke test failed." }
          $hash = (Get-FileHash -LiteralPath "dist/${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("dist/${{ matrix.asset }}.sha256", "$hash  ${{ matrix.asset }}`n", [Text.UTF8Encoding]::new($false))

      - name: Attest native compiler provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/${{ matrix.asset }}

      - name: Upload native compiler
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [verify, native-compiler]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download native compiler artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/native

      - name: Download VS Code extension package
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: dist

      - name: Package Release Archives
        run: |
          TAG="${{ github.ref_name }}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python tools/release_package.py --root . --output dist --tag "$TAG"

      - name: Generate SPDX 2.3 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/nyx-${{ github.ref_name }}.spdx.json
          artifact-name: nyx-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Create and verify release checksums
        shell: bash
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest source archive provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.vsix

      - name: Attest release SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.vsix
            dist/native/nyxc-linux-x86_64
            dist/native/nyxc-windows-x86_64.exe
            dist/native/nyxc-macos-x86_64
            dist/native/nyxc-macos-arm64
          sbom-path: dist/nyx-${{ github.ref_name }}.spdx.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "nyx ${{ github.ref_name }} (Official Release)"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.vsix
            dist/*.spdx.json
            dist/SHA256SUMS
            dist/native/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
