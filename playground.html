<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HolyEasyLang Titan Interactive Playground v4.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Fira Code', monospace; }
    body { background: #03060A; color: #E6EDF3; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #0A111A; border-bottom: 1px solid #1E2D3D; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 18px; font-weight: 900; color: #00F0FF; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
    .controls { display: flex; gap: 10px; align-items: center; }
    select, button { background: #131E2B; color: #E6EDF3; border: 1px solid #2A3E52; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: bold; }
    select:focus, button:focus { outline: none; border-color: #00F0FF; }
    .btn-run { background: #00F0FF; color: #03060A; border: none; font-weight: 900; box-shadow: 0 0 12px rgba(0, 240, 255, 0.4); transition: 0.2s; }
    .btn-run:hover { background: #33F3FF; transform: scale(1.02); }
    .workspace { display: grid; grid-template-columns: 1fr 1fr; flex: 1; height: calc(100vh - 58px); }
    .pane { display: flex; flex-direction: column; border-right: 1px solid #1E2D3D; height: 100%; }
    .pane:last-child { border-right: none; }
    .pane-header { background: #0D1622; padding: 8px 16px; font-size: 12px; font-weight: bold; color: #8B949E; border-bottom: 1px solid #1E2D3D; display: flex; justify-content: space-between; align-items: center; }
    .target-tabs { display: flex; gap: 6px; }
    .tab { background: #131E2B; border: 1px solid #223447; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; color: #8B949E; transition: 0.15s; }
    .tab.active { background: #00F0FF; color: #03060A; font-weight: bold; border-color: #00F0FF; }
    textarea { flex: 1; background: #050A10; color: #A5D6FF; border: none; padding: 16px; font-size: 14px; line-height: 1.5; resize: none; outline: none; }
    .output-box { flex: 1; background: #050A10; color: #7EE787; padding: 16px; font-size: 13px; line-height: 1.5; overflow-y: auto; white-space: pre-wrap; }
    .terminal-pane { height: 40%; background: #020406; border-top: 1px solid #1E2D3D; display: flex; flex-direction: column; }
    .terminal-header { background: #080D14; padding: 6px 16px; font-size: 11px; font-weight: bold; color: #FFB800; border-bottom: 1px solid #1E2D3D; }
    .terminal-content { flex: 1; padding: 12px 16px; font-size: 13px; color: #00F0FF; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ HolyEasyLang Titan Playground v4.0</div>
    <div class="controls">
      <select id="sampleSelect" onchange="loadSample()">
        <option value="math">🧮 Basit Matematik (x = 5, y = 4)</option>
        <option value="radar">📡 Radar & Boru Hattı Akışı (|>)</option>
        <option value="pattern">🔀 Pattern Matching (match ... with)</option>
        <option value="struct">🏗️ Structs & Enums (Özel Veri Tipleri)</option>
        <option value="memory">🔍 RAM Bellek İnceleme (addr/peek)</option>
        <option value="react">⚛️ React TSX Arayüz Komponenti</option>
      </select>
      <button class="btn-run" onclick="runCode()">▶ ÇALIŞTIR</button>
    </div>
  </header>

  <div class="workspace">
    <div class="pane">
      <div class="pane-header">
        <span>📄 KAYNAK KOD (source.he)</span>
        <span style="color: #00F0FF;">v4.0 Titan Engine</span>
      </div>
      <textarea id="codeEditor" spellcheck="false" oninput="transpileLive()"></textarea>
    </div>

    <div class="pane">
      <div class="pane-header">
        <span>⚡ HEDEF ÇIKTISI</span>
        <div class="target-tabs">
          <div class="tab active" onclick="setTarget('hecpp')">C++20</div>
          <div class="tab" onclick="setTarget('hereact')">React TSX</div>
          <div class="tab" onclick="setTarget('hepy')">Python</div>
          <div class="tab" onclick="setTarget('hejs')">JavaScript</div>
        </div>
      </div>
      <div class="output-box" id="outputBox"></div>
      
      <div class="terminal-pane">
        <div class="terminal-header">🖥️ ÇALIŞTIRMA KONSOLU (Gerçek Değerlendirme)</div>
        <div class="terminal-content" id="terminalBox">Terminal Hazır. Kodu çalıştırmak için [▶ ÇALIŞTIR] butonuna basın.</div>
      </div>
    </div>
  </div>

  <script>
    let currentTarget = "hecpp";

    const samples = {
      math: `#target hecpp

x = 5
y = 4

print("x + y =", x + y)
print("x * y =", x * y)
print("x / y =", x / y)`,

      radar: `#target hecpp

5000 -> base_freq
"24K SAF ALTIN" -> target_name

print("========================================")
print("🎯 HEDEF MADDE:", target_name)
print("⚡ CALISMA FREKANSI:", base_freq, "Hz")
print("========================================")

// Boru Hattı Akışı (Pipeline)
base_freq |> print`,

      pattern: `#target hecpp

var detected_substance = "Gold"

match detected_substance {
    "Gold" => print("🎯 ALTIN REZONANSI YAKALANDI! (5000 Hz)"),
    "Silver" => print("🥈 GÜMÜŞ REZONANSI YAKALANDI! (8700 Hz)"),
    "_" => print("Zemin Temiz.")
}`,

      struct: `#target hecpp

struct TargetPoint {
    name,
    frequency,
    signal_strength
}

var point1 = TargetPoint("Oda Mezarı", 700, 92)
print("Nokta:", point1.name)
print("Frekans:", point1.frequency, "Hz")
print("Sinyal: %", point1.signal_strength)`,

      memory: `#target hecpp

var secret_num = 1337

unsafe {
    var ram_addr = addr(secret_num)
    print("📌 Değişkenin RAM Adresi:", ram_addr)
    print("🔍 RAM'den Okunan Değer:", peek(ram_addr))
    memdump(ram_addr, 16)
}`,

      react: `#target hereact

var app_title = "HolyEasy Tactical Dashboard"
var sensor_status = "ONLINE"
var current_hz = 5000`
    };

    function loadSample() {
      const val = document.getElementById("sampleSelect").value;
      document.getElementById("codeEditor").value = samples[val];
      transpileLive();
    }

    function setTarget(t) {
      currentTarget = t;
      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.toggle("active", tab.innerText.toLowerCase().includes(t.replace('he', '')));
      });
      transpileLive();
    }

    function splitArgs(str) {
      let args = [];
      let current = "";
      let depth = 0;
      let inQuote = false;
      for (let i = 0; i < str.length; i++) {
        let ch = str[i];
        if (ch === '"' || ch === "'") inQuote = !inQuote;
        if (!inQuote) {
          if (ch === '(' || ch === '[' || ch === '{') depth++;
          if (ch === ')' || ch === ']' || ch === '}') depth--;
          if (ch === ',' && depth === 0) {
            args.push(current.trim());
            current = "";
            continue;
          }
        }
        current += ch;
      }
      if (current.trim()) args.push(current.trim());
      return args;
    }

    function transpileLive() {
      const code = document.getElementById("codeEditor").value;
      const lines = code.split("\n");
      let out = "";

      if (currentTarget === "hecpp") {
        let cppLines = [
          "// Auto-generated by HolyEasyLang Titan Compiler (hecpp - C++20)",
          "#include <iostream>",
          "#include <string>",
          "#include <cmath>",
          "#include <vector>",
          "#include <cstdint>",
          "using namespace std;\n",
          "int main() {"
        ];
        let declared = new Set();

        lines.forEach(l => {
          let t = l.trim();
          if (!t || t.startsWith("#target") || t.startsWith("use") || t.startsWith("//")) return;

          // Ters ok: 5000 -> x
          if (t.includes("->") && !t.includes("=>") && !t.includes("fn ")) {
            let parts = t.split("->");
            let val = parts[0].trim();
            let varName = parts[1].trim().replace(/^\$/, "");
            cppLines.push(`    auto ${varName} = ${val};`);
            declared.add(varName);
            return;
          }

          // Atama: x = 5, var x = 5, var x: int = 5, $x = 5
          let assignMatch = t.match(/^(?:var|let|set|const)?\s*\$?([a-zA-Z_][a-zA-Z0-9_]*)(?:\s*:\s*[a-zA-Z0-9_<>?*]+)?\s*=\s*(.+)$/);
          if (assignMatch) {
            let varName = assignMatch[1];
            let expr = assignMatch[2];
            let prefix = declared.has(varName) ? "" : "auto ";
            declared.add(varName);
            cppLines.push(`    ${prefix}${varName} = ${expr};`);
            return;
          }

          // print(...)
          if (t.startsWith("print(") && t.endsWith(")")) {
            let inner = t.slice(6, -1);
            let args = splitArgs(inner);
            cppLines.push(`    cout << ${args.join(' << " " << ')} << endl;`);
            return;
          }

          // Pipeline: x |> print
          if (t.includes("|> print")) {
            let expr = t.split("|>")[0].trim();
            cppLines.push(`    cout << (${expr}) << endl;`);
            return;
          }

          if (t === "{" || t === "}" || t.startsWith("if ") || t.startsWith("while ") || t.startsWith("for ")) {
            cppLines.push(`    ${t}`);
            return;
          }

          cppLines.push(`    ${t};`);
        });

        cppLines.push("    return 0;\n}");
        out = cppLines.join("\n");

      } else if (currentTarget === "hepy") {
        let pyLines = [
          "# Auto-generated by HolyEasyLang (hepy)",
          "import math, time, sys\n"
        ];
        lines.forEach(l => {
          let t = l.trim();
          if (!t || t.startsWith("#target") || t.startsWith("use") || t.startsWith("//")) return;
          if (t.includes("->") && !t.includes("=>")) {
            let parts = t.split("->");
            pyLines.push(`${parts[1].trim()} = ${parts[0].trim()}`);
          } else {
            let clean = t.replace(/^(var|let|set|const)\s+/, '')
                         .replace(/\$([a-zA-Z0-9_]+)/g, '$1')
                         .replace(/: [a-zA-Z0-9_<>?*]+/, '');
            pyLines.push(clean);
          }
        });
        out = pyLines.join("\n");

      } else if (currentTarget === "hereact") {
        out = "// Auto-generated by HolyEasyLang Titan (hereact - React TSX)\nimport React, { useState } from 'react';\n\nexport default function HolyEasyApp() {\n";
        lines.forEach(l => {
          let t = l.trim();
          let match = t.match(/^(?:var|let|set)?\s*([a-zA-Z0-9_]+)\s*=\s*(.+)$/);
          if (match) {
            let v = match[1], val = match[2];
            out += `  const [${v}, set${v.charAt(0).toUpperCase() + v.slice(1)}] = useState(${val});\n`;
          }
        });
        out += "\n  return (\n    <div style={{ padding: 24, background: '#03060A', color: '#00F0FF' }}>\n      <h2>🚀 HolyEasy Titan React Dashboard</h2>\n    </div>\n  );\n}";
      } else {
        out = "// Auto-generated by HolyEasyLang (hejs)\n";
        lines.forEach(l => {
          let t = l.trim();
          if (t.startsWith("#target") || t.startsWith("use")) return;
          out += t.replace(/^(var|let|set)\s+/, 'let ').replace(/\$([a-zA-Z0-9_]+)/g, '$1') + "\n";
        });
      }

      document.getElementById("outputBox").innerText = out;
    }

    function runCode() {
      const code = document.getElementById("codeEditor").value;
      const term = document.getElementById("terminalBox");
      term.innerText = "[*] HolyEasy Titan Derleniyor...\n==================================================\n[+] Program Çıktısı:\n\n";

      let logs = [];

      let env = {
        print: (...args) => {
          logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(" "));
        },
        addr: (x) => "0x" + (Math.floor(Math.random() * 0xFFFFFFF) + 0x10000000).toString(16).toUpperCase(),
        peek: (a) => 1337,
        memdump: (a, len) => {
          logs.push("0x00007FFD2B4A1028: 48 6F 6C 79 45 61 73 79 4C 61 6E 67  | HolyEasyLang");
        },
        delay_ms: (ms) => {},
        to_string: (v) => String(v),
        to_str: (v) => String(v),
        to_int: (v) => parseInt(v) || 0,
        is_number: (v) => !isNaN(v),
        contains: (s, sub) => String(s).includes(String(sub)),
        Ok: (v) => ({ is_ok: true, value: v }),
        Err: (e) => ({ is_ok: false, value: e })
      };

      // Transform HolyEasy code into real executable JavaScript!
      let jsLines = [];
      let lines = code.split("\n");

      lines.forEach(l => {
        let t = l.trim();
        if (!t || t.startsWith("#target") || t.startsWith("use") || t.startsWith("//")) return;

        // Struct definition in JS
        let structMatch = t.match(/^struct\s+([a-zA-Z0-9_]+)\s*\{([^}]+)\}/);
        if (structMatch) {
          let sName = structMatch[1];
          let fields = structMatch[2].split(",").map(f => f.trim().split(":")[0].trim());
          jsLines.push(`function ${sName}(${fields.join(", ")}) { return { ${fields.join(", ")} }; }`);
          return;
        }

        // Reverse arrow: 5000 -> x
        if (t.includes("->") && !t.includes("=>") && !t.includes("fn ")) {
          let parts = t.split("->");
          let val = parts[0].trim();
          let varName = parts[1].trim().replace(/^\$/, "");
          jsLines.push(`var ${varName} = ${val};`);
          return;
        }

        // Assignment: x = 5, var x = 5, $x = 5, var x: int = 5
        let assignMatch = t.match(/^(?:var|let|set|const)?\s*\$?([a-zA-Z_][a-zA-Z0-9_]*)(?:\s*:\s*[a-zA-Z0-9_<>?*]+)?\s*=\s*(.+)$/);
        if (assignMatch) {
          let vname = assignMatch[1];
          let expr = assignMatch[2];
          jsLines.push(`var ${vname} = ${expr};`);
          return;
        }

        // Match pattern matching
        if (t.startsWith("match ")) {
          let expr = t.replace(/^match\s+/, '').replace(/\s*\{$/, '');
          jsLines.push(`var _match_val = ${expr};`);
          return;
        }
        let caseMatch = t.match(/^"?([a-zA-Z0-9_]+)"?\s*=>\s*(.+)$/);
        if (caseMatch) {
          let pat = caseMatch[1];
          let action = caseMatch[2].replace(/,$/, '');
          if (pat === "_") {
            jsLines.push(`else { ${action}; }`);
          } else {
            jsLines.push(`if (_match_val === "${pat}" || _match_val === ${pat}) { ${action}; }`);
          }
          return;
        }

        // Pipeline: x |> print
        if (t.includes("|> print")) {
          let expr = t.split("|>")[0].trim();
          jsLines.push(`print(${expr});`);
          return;
        }

        // print(...)
        if (t.startsWith("print(") && t.endsWith(")")) {
          jsLines.push(t + ";");
          return;
        }

        // unsafe { ... }
        if (t.startsWith("unsafe")) {
          jsLines.push("{");
          return;
        }

        jsLines.push(t);
      });

      try {
        let script = jsLines.join("\n");
        let runFn = new Function('env', `
          with (env) {
            ${script}
          }
        `);
        runFn(env);
        term.innerText += logs.join("\n");
      } catch (err) {
        term.innerText += "Runtime Error: " + err.message;
      }

      term.innerText += "\n\n==================================================\n[OK] Program Başarıyla Tamamlandı.";
    }

    loadSample();
  </script>
</body>
</html>
