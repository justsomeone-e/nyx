<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Background Aura -->
    <radialGradient id="auroraGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.22)"/>
      <stop offset="35%" stop-color="rgba(121, 40, 202, 0.16)"/>
      <stop offset="70%" stop-color="rgba(255, 0, 128, 0.06)"/>
      <stop offset="100%" stop-color="rgba(5, 7, 10, 0)"/>
    </radialGradient>

    <!-- Silver-White Metallic Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E1E6EB"/>
      <stop offset="100%" stop-color="#B8C2CC"/>
    </linearGradient>

    <!-- Cyan Electric Bevel Gradient -->
    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>

    <!-- Dark Shadow Bevel -->
    <linearGradient id="shadeFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B8896"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="cosmicBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>

    <filter id="logoDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0, 240, 255, 0.35)"/>
    </filter>
  </defs>

  <style>
    @keyframes auraPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .aura-circle { animation: auraPulse 6s ease-in-out infinite; transform-origin: 450px 150px; }
  </style>

  <!-- Atmospheric Glow Orbs -->
  <ellipse cx="450" cy="150" rx="360" ry="130" fill="url(#auroraGlow)" class="aura-circle" filter="url(#cosmicBlur)"/>
  <ellipse cx="450" cy="150" rx="220" ry="80" fill="rgba(0, 240, 255, 0.12)" filter="url(#cosmicBlur)"/>

  <!-- Main 3D Metallic Nyx Logo Centered -->
  <g transform="translate(145, 45)" filter="url(#logoDropShadow)">
    <!-- LETTER 'n' -->
    <path d="M 60 110 L 96 130 L 96 230 L 60 230 Z" fill="url(#cyanFacet)"/>
    <path d="M 60 70 L 96 70 L 96 130 L 60 110 Z" fill="url(#silverGrad)"/>
    <path d="M 96 70 C 130 50 190 50 200 90 L 200 230 L 164 230 L 164 110 C 158 92 126 92 96 106 Z" fill="url(#silverGrad)"/>
    <path d="M 164 110 L 200 90 L 200 230 L 164 230 Z" fill="url(#shadeFacet)" opacity="0.3"/>

    <!-- LETTER 'y' -->
    <path d="M 270 70 L 330 160 L 305 178 L 245 70 Z" fill="url(#silverGrad)"/>
    <path d="M 375 70 L 275 240 L 310 240 L 410 70 Z" fill="url(#silverGrad)"/>
    <path d="M 315 168 L 348 214 L 325 240 L 295 240 Z" fill="url(#cyanFacet)"/>

    <!-- LETTER 'x' -->
    <path d="M 460 70 L 515 150 L 460 230 L 495 230 L 535 170 L 575 230 L 610 230 L 555 150 L 610 70 L 575 70 L 535 130 L 495 70 Z" fill="url(#silverGrad)"/>
    <path d="M 555 150 L 610 70 L 575 70 L 535 130 Z" fill="url(#cyanFacet)"/>
    <path d="M 515 150 L 460 230 L 495 230 L 535 170 Z" fill="url(#cyanFacet)"/>
  </g>
</svg>