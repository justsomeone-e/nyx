<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Matte Background -->
    <linearGradient id="nyxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1217"/>
      <stop offset="50%" stop-color="#06080B"/>
      <stop offset="100%" stop-color="#010204"/>
    </linearGradient>

    <!-- Celestial Border Ring -->
    <linearGradient id="nyxBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="50%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Electric Cyan-to-White Energy -->
    <linearGradient id="nyxEnergy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#C5F9FF"/>
      <stop offset="75%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="nyxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow -->
    <filter id="nyxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="32" y="32" width="448" height="448" rx="116" ry="116" fill="url(#nyxBg)" stroke="url(#nyxBorder)" stroke-width="4" filter="url(#nyxShadow)"/>

  <!-- Celestial Orbit Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#161E28" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="#10151D" stroke-width="1"/>

  <!-- Ambient Energy Flare behind 'N' -->
  <path d="M280 96 L168 264 L244 264 L224 416 L344 248 L268 248 Z" 
        fill="#00F0FF" opacity="0.18" filter="url(#nyxGlow)" />

  <!-- Stylized Monogram: 'N' with an Electric Diagonal Slash -->
  <!-- Left Vertical Stem of 'N' -->
  <path d="M148 148 L188 148 C192 148 196 152 196 156 L196 356 C196 360 192 364 188 364 L148 364 C144 364 140 360 140 356 L140 156 C140 152 144 148 148 148 Z" 
        fill="#232C37"/>

  <!-- Right Vertical Stem of 'N' -->
  <path d="M324 148 L364 148 C368 148 372 152 372 156 L372 356 C372 360 368 364 364 364 L324 364 C320 364 316 360 316 356 L316 156 C316 152 320 148 324 148 Z" 
        fill="#232C37"/>

  <!-- Dynamic Electric Lightning Center Slash forming the 'N' & Bolt -->
  <path d="M296 104 L172 272 C168 278 172 284 180 284 L248 284 L224 408 C222 418 234 422 240 414 L344 252 C348 246 344 240 336 240 L272 240 L308 112 C310 104 300 98 296 104 Z" 
        fill="url(#nyxEnergy)"/>

  <!-- Subtle Specular Reflection Cut -->
  <path d="M296 104 L228 200 L260 240 L308 112 Z" fill="#FFFFFF" opacity="0.35"/>
</svg>
