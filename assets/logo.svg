<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Pure Obsidian / Jet Black Canvas -->
  <rect width="512" height="512" rx="96" fill="#090A0C"/>
  <rect width="508" height="508" x="2" y="2" rx="94" fill="none" stroke="#1F232B" stroke-width="2"/>

  <!-- Iconic Pure Minimalist 'nyx' Monogram / Geometric Mark -->
  <!-- Crisp, authentic, flat vector geometry with perfect proportions -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Outer Focus Geometric Orbit (Subtle Architectural Detail) -->
    <circle cx="256" cy="256" r="160" stroke="#161A22" stroke-width="2"/>

    <!-- 'n' Curve & Pillar Structure (Silver Metallic #E6EDF3) -->
    <path d="M 160 320 L 160 216 C 160 178 190 156 226 156 C 262 156 286 182 286 216 L 286 320" 
          stroke="#E6EDF3" stroke-width="28"/>

    <!-- 'y' & 'x' Dynamic Diagonal Intersection (Electric Accent #00F0FF) -->
    <!-- Descending sharp slash -->
    <path d="M 216 196 L 352 356" 
          stroke="#00F0FF" stroke-width="28"/>

    <!-- Ascending crossing slash completing the 'x' vertex -->
    <path d="M 352 216 L 276 304" 
          stroke="#E6EDF3" stroke-width="28"/>

    <!-- Micro Precision Core Anchor Point -->
    <circle cx="256" cy="256" r="6" fill="#00F0FF"/>
  </g>
</svg>
