<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#0b1118"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>

    <!-- Silver-White Metallic Gradient (Original Nyx Logo) -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E1E6EB"/>
      <stop offset="100%" stop-color="#B8C2CC"/>
    </linearGradient>

    <!-- Cyan Electric Bevel Gradient (Original Nyx Logo) -->
    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>

    <!-- Dark Shadow Bevel -->
    <linearGradient id="shadeFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B8896"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>

    <!-- Scanning Laser Line -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0)"/>
      <stop offset="50%" stop-color="rgba(0, 240, 255, 0.85)"/>
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0)"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.06)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .title-text { font-family: 'Inter', -apple-system, sans-serif; }
    
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(300px); opacity: 0; }
    }
    .scanner { animation: scanline 5s linear infinite; }

    @keyframes logoPulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.25)); }
      50% { filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.65)); }
    }
    .pulsing-logo { animation: logoPulse 4s ease-in-out infinite; }
  </style>

  <!-- Base Card Background -->
  <rect width="1000" height="300" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1000" height="300" rx="16" fill="url(#cyberGrid)"/>

  <!-- Scanning Laser -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="url(#laserBeam)" stroke-width="2" class="scanner" filter="url(#glowFilter)"/>

  <!-- Ambient Light Glow Behind Logo -->
  <circle cx="280" cy="110" r="120" fill="#00f0ff" opacity="0.07" filter="url(#intenseGlow)"/>
  <circle cx="850" cy="140" r="100" fill="#7928ca" opacity="0.06" filter="url(#intenseGlow)"/>

  <!-- TOP SECTION: ORIGINAL NYX LOGO + COMPILER METADATA -->
  <g transform="translate(45, 10)">
    
    <!-- ORIGINAL NYX METALLIC EMBLEM LOGO (Scaled 0.65x) -->
    <g transform="translate(0, 0) scale(0.68)" class="pulsing-logo">
      <!-- LETTER 'n' -->
      <path d="M 60 110 L 96 130 L 96 230 L 60 230 Z" fill="url(#cyanFacet)"/>
      <path d="M 60 70 L 96 70 L 96 130 L 60 110 Z" fill="url(#silverGrad)"/>
      <path d="M 96 70 C 130 50 190 50 200 90 L 200 230 L 164 230 L 164 110 C 158 92 126 92 96 106 Z" fill="url(#silverGrad)"/>
      <path d="M 164 110 L 200 90 L 200 230 L 164 230 Z" fill="url(#shadeFacet)" opacity="0.3"/>

      <!-- LETTER 'y' -->
      <path d="M 270 70 L 330 160 L 305 178 L 245 70 Z" fill="url(#silverGrad)"/>
      <path d="M 375 70 L 275 240 L 310 240 L 410 70 Z" fill="url(#silverGrad)"/>
      <path d="M 315 168 L 348 214 L 325 240 L 295 240 Z" fill="url(#cyanFacet)"/>

      <!-- LETTER 'x' -->
      <path d="M 460 70 L 515 150 L 460 230 L 495 230 L 535 170 L 575 230 L 610 230 L 555 150 L 610 70 L 575 70 L 535 130 L 495 70 Z" fill="url(#silverGrad)"/>
      <path d="M 555 150 L 610 70 L 575 70 L 535 130 Z" fill="url(#cyanFacet)"/>
      <path d="M 515 150 L 460 230 L 495 230 L 535 170 Z" fill="url(#cyanFacet)"/>
    </g>

    <!-- Side Subtitles and Information -->
    <g transform="translate(460, 50)">
      <rect x="0" y="0" width="185" height="24" rx="4" fill="rgba(0, 240, 255, 0.1)" stroke="#00f0ff" stroke-width="1"/>
      <text x="10" y="16" class="mono" font-size="11" font-weight="700" fill="#00f0ff" letter-spacing="1.5">SYSTEMS COMPILER</text>

      <text x="0" y="48" class="mono" font-size="15" font-weight="700" fill="#ffffff">v3.0.0-beta.3 · Self-Hosting Toolchain</text>
      <text x="0" y="74" class="mono" font-size="12.5" fill="#94a3b8">
        Multi-Target: <tspan fill="#00f0ff">C++20 Native</tspan> · <tspan fill="#ff0080">x86_64 ASM</tspan> · <tspan fill="#4ade80">Node.js</tspan> · <tspan fill="#f59e0b">Rust</tspan> · <tspan fill="#a855f7">Python</tspan>
      </text>
      <text x="0" y="94" class="mono" font-size="11.5" fill="#64748b">
        Deterministic AST Pipeline · Zero-Cost ABI · Sub-Character Diagnostics v2
      </text>
    </g>

  </g>

  <!-- BOTTOM BADGES ROW -->
  <g transform="translate(50, 215)">
    <!-- Badge 1: Self-Host Parity -->
    <rect x="0" y="0" width="205" height="48" rx="8" fill="#0c131d" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="20" cy="24" r="5" fill="#00f0ff" filter="url(#glowFilter)"/>
    <text x="36" y="20" class="mono" font-size="10.5" font-weight="700" fill="#00f0ff">SELF-HOSTING</text>
    <text x="36" y="36" class="mono" font-size="12" fill="#e2e8f0">100% Token Parity</text>

    <!-- Badge 2: Assembly Target -->
    <rect x="225" y="0" width="205" height="48" rx="8" fill="#0c131d" stroke="#ff0080" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="245" cy="24" r="5" fill="#ff0080" filter="url(#glowFilter)"/>
    <text x="261" y="20" class="mono" font-size="10.5" font-weight="700" fill="#ff0080">TARGET ENGINE</text>
    <text x="261" y="36" class="mono" font-size="12" fill="#e2e8f0">#target heasm (x64)</text>

    <!-- Badge 3: Type Safety -->
    <rect x="450" y="0" width="205" height="48" rx="8" fill="#0c131d" stroke="#4ade80" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="470" cy="24" r="5" fill="#4ade80" filter="url(#glowFilter)"/>
    <text x="486" y="20" class="mono" font-size="10.5" font-weight="700" fill="#4ade80">TYPECHECKER</text>
    <text x="486" y="36" class="mono" font-size="12" fill="#e2e8f0">Dual Rejection Pass</text>

    <!-- Badge 4: Tree Shaking -->
    <rect x="675" y="0" width="225" height="48" rx="8" fill="#0c131d" stroke="#7928ca" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="695" cy="24" r="5" fill="#7928ca" filter="url(#glowFilter)"/>
    <text x="711" y="20" class="mono" font-size="10.5" font-weight="700" fill="#b794f4">CODE GENERATOR</text>
    <text x="711" y="36" class="mono" font-size="12" fill="#e2e8f0">Tree-Shaken Helpers</text>
  </g>
</svg>