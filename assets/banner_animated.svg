<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#0a1017"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>

    <!-- Neon Cyan / Violet Animated Glow -->
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#7928ca;#ff0080;#00f0ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#ff0080;#00f0ff;#7928ca" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ff0080">
        <animate attributeName="stop-color" values="#ff0080;#00f0ff;#7928ca;#ff0080" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Scanning Laser Line -->
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0)"/>
      <stop offset="50%" stop-color="rgba(0, 240, 255, 0.8)"/>
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0)"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.07)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .title-text { font-family: 'Inter', -apple-system, sans-serif; font-weight: 900; }
    
    @keyframes pulseCard {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.9; }
    }
    .pulsing-box { animation: pulseCard 4s ease-in-out infinite; }
    
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(280px); opacity: 0; }
    }
    .scanner { animation: scanline 5s linear infinite; }
  </style>

  <!-- Base Card Background -->
  <rect width="1000" height="280" rx="16" fill="url(#bgGrad)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5"/>
  <rect width="1000" height="280" rx="16" fill="url(#cyberGrid)"/>

  <!-- Scanning Laser -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="url(#laserBeam)" stroke-width="2" class="scanner" filter="url(#glowFilter)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="140" r="90" fill="#00f0ff" opacity="0.06" filter="url(#intenseGlow)"/>
  <circle cx="850" cy="140" r="110" fill="#7928ca" opacity="0.08" filter="url(#intenseGlow)"/>

  <!-- Main Logo & Typo -->
  <g transform="translate(60, 55)">
    <!-- nyx Geometric Emblem -->
    <g transform="translate(0, 5)">
      <polygon points="40,0 80,24 80,72 40,96 0,72 0,24" fill="none" stroke="url(#cyberGlow)" stroke-width="3" filter="url(#glowFilter)" class="pulsing-box"/>
      <polygon points="40,15 65,30 65,60 40,75 15,60 15,30" fill="rgba(0, 240, 255, 0.05)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
      <circle cx="40" cy="45" r="7" fill="#00f0ff" filter="url(#glowFilter)"/>
      <line x1="40" y1="15" x2="40" y2="75" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
      <line x1="15" y1="30" x2="65" y2="60" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
    </g>

    <!-- Title and Subtitle -->
    <text x="110" y="52" class="title-text" font-size="52" fill="#ffffff" letter-spacing="-1.5">nyx</text>
    <text x="215" y="32" class="mono" font-size="12" font-weight="700" fill="#00f0ff" letter-spacing="2">[ SYSTEMS COMPILER ]</text>
    <text x="215" y="52" class="mono" font-size="14" fill="#a0aec0">v3.0.0-beta.3 · Self-Hosting Toolchain</text>

    <text x="110" y="85" class="mono" font-size="13" fill="#718096">
      Multi-Target Pipeline: <tspan fill="#00f0ff">C++20 Native</tspan> · <tspan fill="#ff0080">x86_64 ASM</tspan> · <tspan fill="#68d391">Node.js</tspan> · <tspan fill="#f6ad55">Rust</tspan> · <tspan fill="#63b3ed">Python</tspan>
    </text>
  </g>

  <!-- Live Badges Row -->
  <g transform="translate(60, 195)">
    <!-- Badge 1: Self-Host Parity -->
    <rect x="0" y="0" width="190" height="42" rx="8" fill="#0e151f" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="18" cy="21" r="5" fill="#00f0ff" filter="url(#glowFilter)"/>
    <text x="32" y="18" class="mono" font-size="10" font-weight="700" fill="#00f0ff">SELF-HOSTING</text>
    <text x="32" y="32" class="mono" font-size="11" fill="#e2e8f0">100% Token Parity</text>

    <!-- Badge 2: Assembly Target -->
    <rect x="205" y="0" width="190" height="42" rx="8" fill="#0e151f" stroke="#ff0080" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="223" cy="21" r="5" fill="#ff0080" filter="url(#glowFilter)"/>
    <text x="237" y="18" class="mono" font-size="10" font-weight="700" fill="#ff0080">TARGET ENGINE</text>
    <text x="237" y="32" class="mono" font-size="11" fill="#e2e8f0">#target heasm (x64)</text>

    <!-- Badge 3: Type Safety -->
    <rect x="410" y="0" width="190" height="42" rx="8" fill="#0e151f" stroke="#68d391" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="428" cy="21" r="5" fill="#68d391" filter="url(#glowFilter)"/>
    <text x="442" y="18" class="mono" font-size="10" font-weight="700" fill="#68d391">TYPECHECKER</text>
    <text x="442" y="32" class="mono" font-size="11" fill="#e2e8f0">Dual Rejection Pass</text>

    <!-- Badge 4: Tree Shaking -->
    <rect x="615" y="0" width="265" height="42" rx="8" fill="#0e151f" stroke="#7928ca" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="633" cy="21" r="5" fill="#7928ca" filter="url(#glowFilter)"/>
    <text x="647" y="18" class="mono" font-size="10" font-weight="700" fill="#b794f4">CODE GENERATOR</text>
    <text x="647" y="32" class="mono" font-size="11" fill="#e2e8f0">On-Demand Tree-Shaking</text>
  </g>
</svg>