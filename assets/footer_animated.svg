<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" height="100%">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#0c121a"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E1E6EB"/>
      <stop offset="100%" stop-color="#B8C2CC"/>
    </linearGradient>

    <linearGradient id="cyanFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>

    <linearGradient id="shadeFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B8896"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>

    <filter id="footGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="footGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 240, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: 'Inter', system-ui, sans-serif; }
    
    @keyframes footScan {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.85; }
    }
    .foot-pulse { animation: footScan 3s ease-in-out infinite; }
  </style>

  <!-- Container -->
  <rect width="960" height="140" rx="12" fill="url(#footBg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="960" height="140" rx="12" fill="url(#footGrid)"/>

  <!-- Left: Mini Metallic Nyx Logo -->
  <g transform="translate(30, -18) scale(0.42)">
    <path d="M 60 110 L 96 130 L 96 230 L 60 230 Z" fill="url(#cyanFacet)"/>
    <path d="M 60 70 L 96 70 L 96 130 L 60 110 Z" fill="url(#silverGrad)"/>
    <path d="M 96 70 C 130 50 190 50 200 90 L 200 230 L 164 230 L 164 110 C 158 92 126 92 96 106 Z" fill="url(#silverGrad)"/>
    <path d="M 164 110 L 200 90 L 200 230 L 164 230 Z" fill="url(#shadeFacet)" opacity="0.3"/>

    <path d="M 270 70 L 330 160 L 305 178 L 245 70 Z" fill="url(#silverGrad)"/>
    <path d="M 375 70 L 275 240 L 310 240 L 410 70 Z" fill="url(#silverGrad)"/>
    <path d="M 315 168 L 348 214 L 325 240 L 295 240 Z" fill="url(#cyanFacet)"/>

    <path d="M 460 70 L 515 150 L 460 230 L 495 230 L 535 170 L 575 230 L 610 230 L 555 150 L 610 70 L 575 70 L 535 130 L 495 70 Z" fill="url(#silverGrad)"/>
    <path d="M 555 150 L 610 70 L 575 70 L 535 130 Z" fill="url(#cyanFacet)"/>
    <path d="M 515 150 L 460 230 L 495 230 L 535 170 Z" fill="url(#cyanFacet)"/>
  </g>

  <!-- Center Text (Strictly bounded between x=280 and x=760) -->
  <g transform="translate(290, 42)">
    <text x="0" y="16" class="sans" font-size="15" font-weight="700" fill="#ffffff">nyx Systems Programming Language</text>
    <text x="0" y="38" class="mono" font-size="11.5" fill="#94a3b8">Deterministic compilation · Multi-target ecosystems</text>
    <text x="0" y="58" class="mono" font-size="10.5" fill="#64748b">C++20 · x86_64 ASM · Node.js · Rust 2021 · Python 3</text>
  </g>

  <!-- Right Badge -->
  <g transform="translate(780, 44)">
    <rect width="145" height="52" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" class="foot-pulse" filter="url(#footGlow)"/>
    <text x="72" y="23" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#00f0ff">MIT LICENSE</text>
    <text x="72" y="40" text-anchor="middle" class="mono" font-size="10" fill="#e2e8f0">Free &amp; Open Source</text>
  </g>
</svg>