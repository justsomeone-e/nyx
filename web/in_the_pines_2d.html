<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IN THE PINES — 2D Undertale Edition</title>
    <style>
        :root {
            --ut-bg: #000000;
            --ut-white: #ffffff;
            --ut-red: #ff0000;
            --ut-yellow: #ffff00;
            --ut-blue: #00ffff;
            --ut-orange: #ff9900;
            --ut-border: #ffffff;
            --ut-gray: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #050508;
            color: var(--ut-white);
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 4:3 CRT Retro Display Container */
        #game-frame {
            position: relative;
            width: 640px;
            height: 480px;
            background-color: var(--ut-bg);
            border: 4px solid #222633;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 20px rgba(0, 255, 255, 0.15);
            image-rendering: pixelated;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        /* Ambient Audio Bar */
        #audio-hud {
            width: 640px;
            background: #0d1117;
            border: 2px solid #222633;
            border-top: none;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .hud-btn {
            background: #161f2c;
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 4px 10px;
            font-family: inherit;
            font-size: 0.75rem;
            border-radius: 3px;
            cursor: pointer;
        }

        .hud-btn:hover {
            background: #253346;
            color: var(--ut-yellow);
        }

        .hint-bar {
            margin-top: 8px;
            font-size: 0.76rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-frame">
        <canvas id="stage" width="640" height="480"></canvas>
    </div>

    <div id="audio-hud">
        <div>
            <span style="color:var(--ut-yellow);">[CASSETTE]</span>
            <span id="tape-status">MTV UNPLUGGED 1993 (WHERE DID YOU SLEEP LAST NIGHT)</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <button class="hud-btn" style="color:#ff4444; font-weight:bold; border-color:#ff4444;" onclick="startBattle()">⚔️ VS AT (BOSS FIGHT)</button>
        <button class="hud-btn" onclick="toggleAudio()">▶ START AUDIO</button>
            <input type="range" min="0" max="1" step="0.05" value="0.65" style="width:60px; accent-color:var(--ut-yellow);" oninput="setAudioVolume(this.value)">
        </div>
    </div>

    <div class="hint-bar">
        [ARROW KEYS / WASD] Walk • [Z / ENTER] Interact / Confirm • [X / SHIFT] Cancel / Run
    </div>

    <!-- Nirvana Uncut Audio Element -->
    <audio id="nirvana-audio" preload="auto">
        <source src="https://archive.org/download/NirvanaUnpluggedLiveUSA/12%20-%20Where%20Did%20You%20Sleep%20Last%20Night.mp3" type="audio/mpeg">
        <source src="https://p.scdn.co/mp3-preview/80b267c313117482050242cd0acbccf180da798c" type="audio/mpeg">
    </audio>

    <script>
        // ==============================================================
        // 1. SOUND SYNTHESIZER (Undertale Beeps, Chords, Slashes)
        // ==============================================================
        let audioCtx = null;
        let isAudioPlaying = false;
        const audioElem = document.getElementById('nirvana-audio');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioElem.volume = 0.65;
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleAudio() {
            initAudio();
            if (isAudioPlaying) {
                audioElem.pause();
                isAudioPlaying = false;
                document.getElementById('tape-status').innerText = "PAUSED";
            } else {
                if (audioElem.currentTime < 5.2 || audioElem.currentTime >= 313.5) audioElem.currentTime = 5.2;
                audioElem.play().catch(() => {});
                isAudioPlaying = true;
                document.getElementById('tape-status').innerText = "PLAYING (MTV UNPLUGGED 1993)";
            }
        }

        function setAudioVolume(val) {
            if (audioElem) audioElem.volume = parseFloat(val);
        }

        // Undertale Text Blip (Typewriter Voice)
        function playTextBlip() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(120 + Math.random() * 15, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.045);
        }

        // Undertale Battle Encounter Sound
        function playEncounterSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.35);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.36);
        }

        // Acoustic Nylon Guitar Chord Synthesis
        const CHORD_PITCHES = {
            'Em': [82.4, 123.4, 164.8, 196.0, 246.9, 329.6],
            'A':  [110.0, 164.8, 220.0, 277.1, 329.6],
            'G':  [98.0, 123.4, 146.8, 196.0, 246.9, 392.0],
            'B':  [123.4, 185.0, 246.9, 293.6, 370.0]
        };

        function playChord(chordName) {
            if (!audioCtx) return;
            const freqs = CHORD_PITCHES[chordName] || CHORD_PITCHES['Em'];
            const now = audioCtx.currentTime;
            freqs.forEach((f, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(f, now + i * 0.035);
                gain.gain.setValueAtTime(0.22, now + i * 0.035);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.035 + 2.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.035);
                osc.stop(now + i * 0.035 + 2.3);
            });
        }

        // ==============================================================
        // 2. 2D ENGINE & GAME STATE
        // ==============================================================
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');

        // Mode: 'OVERWORLD' or 'BATTLE' or 'ENDING'
        let gameMode = 'OVERWORLD';

        // Overworld Player
        const player = {
            x: 320,
            y: 380,
            w: 20,
            h: 28,
            speed: 2.8,
            dir: 'UP', // 'UP', 'DOWN', 'LEFT', 'RIGHT'
            moving: false,
            animFrame: 0,
            animTimer: 0,
            hp: 20,
            maxHp: 20,
            lv: 1,
            gold: 0,
            has_lantern: false,
            has_hairpin: false,
            has_journal: false,
            knows_wheel: false,
            clues: 0
        };

        // Snow footprints trail
        const footprints = [];

        // Interactive World Map Entities
        const worldObjects = [
            // Signpost at crossroads
            { id: 'sign', x: 300, y: 280, w: 24, h: 20, type: 'sign',
              text: "* [CROSSROADS SIGNPOST]\n* Left: Deep Pine Forest\n* Right: Abandoned Train Tracks\n* North: The Old Cabin" },
            
            // Log Cabin
            { id: 'cabin', x: 260, y: 60, w: 120, h: 90, type: 'cabin',
              door: { x: 305, y: 140, w: 30, h: 20 },
              text: "* An old wooden cabin.\n* Smells of damp cedar and long-extinguished campfires." },

            // Cabin Fireplace
            { id: 'fireplace', x: 280, y: 70, w: 30, h: 20, inside: true,
              text: "* A cold stone hearth.\n* You strike your lighter. A small flame warms your numb fingers." },

            // Cabin Cupboard
            { id: 'cupboard', x: 340, y: 70, w: 25, h: 25, inside: true,
              text: "* Inside the cupboard, you found a Brass Kerosene Lantern!" },

            // Ghostly Locomotive Engine & Drive Wheel on right
            { id: 'wheel', x: 530, y: 220, w: 45, h: 45, type: 'wheel',
              text: "* A colossal rusted locomotive driving wheel.\n* Initial 'K' is carved into the steel...\n* Tangled blonde hair is caught in the bolts!" },

            // Campfire Stump in Deep Pines on left
            { id: 'stump', x: 80, y: 240, w: 30, h: 30, type: 'stump',
              text: "* A burnt campfire stump.\n* A torn notebook page reads:\n* 'Where did you sleep last night, my girl?'" },

            // The Sacred Gravestone at north clearing
            { id: 'grave', x: 310, y: -260, w: 30, h: 35, type: 'grave',
              text: "* A lonely moss-covered gravestone.\n* 'IN THE PINES - WHERE THE SUN DON'T EVER SHINE'." }
        ];

        // Pine Trees Forest Obstacles
        const trees = [
            { x: 40, y: 60 }, { x: 120, y: 40 }, { x: 180, y: 90 }, { x: 50, y: 150 },
            { x: 110, y: 320 }, { x: 60, y: 400 }, { x: 180, y: 420 },
            { x: 460, y: 60 }, { x: 540, y: 80 }, { x: 440, y: 140 }, { x: 560, y: 340 },
            { x: 480, y: 410 }, { x: 580, y: 430 }, { x: 380, y: 20 }, { x: 220, y: 20 }
        ];

        // ==============================================================
        // 3. DIALOGUE SYSTEM (Undertale Box & Blip Typewriter)
        // ==============================================================
        let dialogActive = false;
        let dialogLines = [];
        let dialogIndex = 0;
        let charIndex = 0;
        let charTimer = 0;
        let currentTypedText = "";
        let onDialogComplete = null;

        function showDialogue(lines, callback) {
            dialogActive = true;
            dialogLines = Array.isArray(lines) ? lines : [lines];
            dialogIndex = 0;
            charIndex = 0;
            currentTypedText = "";
            onDialogComplete = callback || null;
        }

        function updateDialogue() {
            if (!dialogActive) return;
            const targetLine = dialogLines[dialogIndex];
            if (charIndex < targetLine.length) {
                charTimer++;
                if (charTimer % 2 === 0) {
                    currentTypedText += targetLine[charIndex];
                    if (targetLine[charIndex] !== ' ' && targetLine[charIndex] !== '\n') {
                        playTextBlip();
                    }
                    charIndex++;
                }
            }
        }

        function advanceDialogue() {
            if (!dialogActive) return;
            const targetLine = dialogLines[dialogIndex];
            // If typing, instantly show full line
            if (charIndex < targetLine.length) {
                currentTypedText = targetLine;
                charIndex = targetLine.length;
            } else {
                // Next line
                dialogIndex++;
                if (dialogIndex < dialogLines.length) {
                    charIndex = 0;
                    currentTypedText = "";
                } else {
                    dialogActive = false;
                    if (onDialogComplete) onDialogComplete();
                }
            }
        }

        // ==============================================================
        // 4. UNDERTALE BATTLE SYSTEM (Acoustic Soul Encounter)
        // ==============================================================
        const battle = {
            turn: 'PLAYER', // 'PLAYER', 'ENEMY', 'TIMING_BAR'
            menu: 'MAIN',   // 'MAIN', 'ACT_SELECT', 'ITEM_SELECT'
            selectedBtn: 0, // 0: STRUM, 1: ACT, 2: ITEM, 3: MERCY
            selectedSub: 0,
            subOptions: [],
            soul: { x: 320, y: 280, r: 7, speed: 3.5 },
            box: { x: 200, y: 200, w: 240, h: 140 },
            bullets: [],
            enemyHp: 100,
            enemyPacified: false,
            shake: 0,
            turnTimer: 0,
            timingBar: { x: 0, active: false, hit: false }
        };

        function startBattle() {
            initAudio();
            playEncounterSound();
            gameMode = 'BATTLE';
            battle.turn = 'PLAYER';
            battle.menu = 'MAIN';
            battle.selectedBtn = 0;
            battle.enemyHp = 100;
            battle.enemyPacified = false;
            battle.soul.x = 320;
            battle.soul.y = 280;
            battle.bullets = [];
            showDialogue([
                "* THE GHOST OF THE PINES BLOCKS THE WAY!",
                "* (A cold breeze weeps through her spectral dress.)"
            ]);
        }

        function updateBattle() {
            if (battle.shake > 0) battle.shake--;

            if (battle.turn === 'ENEMY') {
                battle.turnTimer++;

                // Soul Movement inside the box
                if (keys['ArrowUp'] || keys['KeyW']) battle.soul.y -= battle.soul.speed;
                if (keys['ArrowDown'] || keys['KeyS']) battle.soul.y += battle.soul.speed;
                if (keys['ArrowLeft'] || keys['KeyA']) battle.soul.x -= battle.soul.speed;
                if (keys['ArrowRight'] || keys['KeyD']) battle.soul.x += battle.soul.speed;

                // Box bounds collision
                battle.soul.x = Math.max(battle.box.x + battle.soul.r + 2, Math.min(battle.box.x + battle.box.w - battle.soul.r - 2, battle.soul.x));
                battle.soul.y = Math.max(battle.box.y + battle.soul.r + 2, Math.min(battle.box.y + battle.box.h - battle.soul.r - 2, battle.soul.y));

                // Spawn Bullets (Falling pine needles & teardrops)
                if (battle.turnTimer % 18 === 0) {
                    battle.bullets.push({
                        x: battle.box.x + 10 + Math.random() * (battle.box.w - 20),
                        y: battle.box.y + 4,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: 2.2 + Math.random() * 1.5,
                        r: 4
                    });
                }

                // Update Bullets & Hit Detection
                for (let i = battle.bullets.length - 1; i >= 0; i--) {
                    const b = battle.bullets[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    // Hit soul
                    const dist = Math.hypot(b.x - battle.soul.x, b.y - battle.soul.y);
                    if (dist < b.r + battle.soul.r) {
                        player.hp = Math.max(1, player.hp - 3);
                        battle.shake = 8;
                        battle.bullets.splice(i, 1);
                        continue;
                    }

                    if (b.y > battle.box.y + battle.box.h) {
                        battle.bullets.splice(i, 1);
                    }
                }

                // Turn End
                if (battle.turnTimer > 280) {
                    battle.turn = 'PLAYER';
                    battle.menu = 'MAIN';
                    battle.bullets = [];
                }
            }

            else if (battle.turn === 'TIMING_BAR') {
                battle.timingBar.x += 6.5;
                if (battle.timingBar.x > battle.box.w) {
                    // Miss
                    battle.turn = 'ENEMY';
                    battle.turnTimer = 0;
                    showDialogue("* You missed the chord rhythm!");
                }
            }
        }

        // ==============================================================
        // 5. INPUT CONTROLLER
        // ==============================================================
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyB') { startBattle(); }

            // [Z] or [Enter] - Action / Confirm
            if (e.code === 'KeyZ' || e.code === 'Enter') {
                initAudio();
                if (dialogActive) {
                    advanceDialogue();
                } else if (gameMode === 'OVERWORLD') {
                    interactOverworld();
                } else if (gameMode === 'BATTLE') {
                    handleBattleSelect();
                }
            }

            // [X] or [Shift] - Cancel / Speedup
            if (e.code === 'KeyX' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                if (dialogActive) {
                    // Speed up text
                    const targetLine = dialogLines[dialogIndex];
                    currentTypedText = targetLine;
                    charIndex = targetLine.length;
                } else if (gameMode === 'BATTLE' && battle.menu !== 'MAIN' && battle.turn === 'PLAYER') {
                    battle.menu = 'MAIN';
                }
            }

            // Battle Menu Navigation
            if (gameMode === 'BATTLE' && battle.turn === 'PLAYER' && !dialogActive) {
                if (battle.menu === 'MAIN') {
                    if (e.code === 'ArrowLeft' || e.code === 'KeyA') battle.selectedBtn = (battle.selectedBtn + 3) % 4;
                    if (e.code === 'ArrowRight' || e.code === 'KeyD') battle.selectedBtn = (battle.selectedBtn + 1) % 4;
                } else if (battle.menu === 'ACT_SELECT' || battle.menu === 'ITEM_SELECT') {
                    if (e.code === 'ArrowUp' || e.code === 'KeyW') battle.selectedSub = Math.max(0, battle.selectedSub - 1);
                    if (e.code === 'ArrowDown' || e.code === 'KeyS') battle.selectedSub = Math.min(battle.subOptions.length - 1, battle.selectedSub + 1);
                }
            }

            // Strum timing press
            if (gameMode === 'BATTLE' && battle.turn === 'TIMING_BAR' && (e.code === 'KeyZ' || e.code === 'Enter' || e.code === 'Space')) {
                const targetCenter = battle.box.w / 2;
                const accuracy = Math.abs(battle.timingBar.x - targetCenter);
                if (accuracy < 35) {
                    playChord('Em');
                    battle.enemyHp -= 35;
                    showDialogue([
                        "* PERFECT STRUM! [Em Chord]",
                        "* The acoustic vibration pierces the cold mist!",
                        "* The lost girl closes her eyes peacefully."
                    ], () => {
                        if (battle.enemyHp <= 30) battle.enemyPacified = true;
                        battle.turn = 'ENEMY';
                        battle.turnTimer = 0;
                    });
                } else {
                    playChord('G');
                    showDialogue("* A gentle chord echoed in the trees.", () => {
                        battle.turn = 'ENEMY';
                        battle.turnTimer = 0;
                    });
                }
                battle.turn = 'PLAYER_RESOLVE';
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // ==============================================================
        // 6. OVERWORLD LOGIC & INTERACTIONS
        // ==============================================================
        function updateOverworld() {
            if (dialogActive) return;

            let dx = 0;
            let dy = 0;

            if (keys['ArrowUp'] || keys['KeyW']) { dy -= 1; player.dir = 'UP'; }
            if (keys['ArrowDown'] || keys['KeyS']) { dy += 1; player.dir = 'DOWN'; }
            if (keys['ArrowLeft'] || keys['KeyA']) { dx -= 1; player.dir = 'LEFT'; }
            if (keys['ArrowRight'] || keys['KeyD']) { dx += 1; player.dir = 'RIGHT'; }

            player.moving = (dx !== 0 || dy !== 0);

            if (player.moving) {
                player.x += dx * player.speed;
                player.y += dy * player.speed;

                player.animTimer++;
                if (player.animTimer % 8 === 0) {
                    player.animFrame = (player.animFrame + 1) % 4;
                    // Add footprint in snow
                    if (footprints.length > 30) footprints.shift();
                    footprints.push({ x: player.x + 8, y: player.y + 24, alpha: 0.6 });
                }

                // Random encounter check near deep pines or tracks
                if (player.x < 140 && player.y < 300 && Math.random() < 0.003) {
                    startBattle();
                }
            }

            // Fade footprints
            footprints.forEach(fp => fp.alpha -= 0.001);

            // Screen boundaries
            player.x = Math.max(20, Math.min(600, player.x));
            player.y = Math.max(-280, Math.min(440, player.y));
        }

        function interactOverworld() {
            // Find closest object in front of player
            const pCenter = { x: player.x + 10, y: player.y + 14 };

            for (const obj of worldObjects) {
                const dist = Math.hypot(pCenter.x - (obj.x + obj.w / 2), pCenter.y - (obj.y + obj.h / 2));
                if (dist < 55) {
                    if (obj.id === 'cupboard' && !player.has_lantern) {
                        player.has_lantern = true;
                        player.clues++;
                        showDialogue([
                            "* You opened the cupboard.",
                            "* You obtained the Kerosene Lantern!",
                            "* (The golden wick casts long, warm shadows.)"
                        ]);
                    } else if (obj.id === 'wheel') {
                        if (player.has_lantern) {
                            player.knows_wheel = true;
                            player.clues++;
                            showDialogue([
                                "* In the lantern's beam, the driving wheel is clear.",
                                "* Initial 'K' is gouged into the hub.",
                                "* 'His head was found in a driving wheel...'",
                                "* You obtained: [BLOOD-STAINED HAIRPIN]!"
                            ]);
                        } else {
                            showDialogue([
                                "* It's too pitch black to inspect the iron wheel.",
                                "* You need a light source."
                            ]);
                        }
                    } else if (obj.id === 'grave') {
                        // Trigger final battle / ending
                        startBattle();
                    } else {
                        showDialogue(obj.text);
                    }
                    return;
                }
            }

            // Default self-interaction: Strum guitar
            playChord('Em');
            showDialogue([
                "* You strummed an acoustic chord into the freezing mountain air.",
                "* (Hearing the melody fills you with MELANCHOLY.)"
            ]);
        }

        function handleBattleSelect() {
            if (battle.menu === 'MAIN') {
                if (battle.selectedBtn === 0) {
                    // [ STRUM ]
                    battle.turn = 'TIMING_BAR';
                    battle.timingBar.x = 0;
                } else if (battle.selectedBtn === 1) {
                    // [ ACT ]
                    battle.menu = 'ACT_SELECT';
                    battle.subOptions = ["* Check", "* Hum Along", "* Offer Scarf", "* Sing Lyric"];
                    battle.selectedSub = 0;
                } else if (battle.selectedBtn === 2) {
                    // [ ITEM ]
                    battle.menu = 'ITEM_SELECT';
                    battle.subOptions = ["* Nylon Guitar", "* Lighter", "* Kerosene Lantern"];
                    battle.selectedSub = 0;
                } else if (battle.selectedBtn === 3) {
                    // [ MERCY ]
                    if (battle.enemyPacified) {
                        showDialogue([
                            "* YOU SPARED THE LOST GIRL.",
                            "* The freezing mist gently parts.",
                            "* Dawn sunlight warms your guitar frets.",
                            "* You won the encounter! (+0 EXP, +0 G)"
                        ], () => {
                            gameMode = 'OVERWORLD';
                        });
                    } else {
                        showDialogue("* She is shivering too violently to be spared yet.");
                    }
                }
            } else if (battle.menu === 'ACT_SELECT') {
                const act = battle.subOptions[battle.selectedSub];
                if (act === "* Check") {
                    showDialogue("* LOST GIRL - ATK 3 DEF 0.\n* Vanished into the pines in 1986.\n* Frozen in eternal sorrow.");
                } else if (act === "* Hum Along") {
                    playChord('A');
                    battle.enemyPacified = true;
                    showDialogue("* You hummed 'In The Pines' softly.\n* She stopped weeping and listened.");
                } else if (act === "* Offer Scarf") {
                    showDialogue("* You wrapped your warm scarf around her shoulders.\n* A faint smile touches her pale face.");
                } else if (act === "* Sing Lyric") {
                    playChord('Em');
                    showDialogue("* 'My girl, my girl, tell me where did you sleep last night?'\n* She whispers: 'In the pines...'");
                }
                battle.turn = 'ENEMY';
                battle.turnTimer = 0;
            }
        }

        // ==============================================================
        // 7. RENDERING PIPELINE (Pixel Graphics & UI)
        // ==============================================================
        function drawOverworld() {
            // Background Snow & Night Mist
            ctx.fillStyle = "#0c131f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Footprints
            footprints.forEach(fp => {
                ctx.fillStyle = `rgba(30, 41, 59, ${fp.alpha})`;
                ctx.fillRect(fp.x, fp.y, 4, 3);
            });

            // Train Tracks running on the right side
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(520, 0, 8, canvas.height);
            ctx.fillRect(560, 0, 8, canvas.height);
            for (let y = 0; y < canvas.height; y += 18) {
                ctx.fillStyle = "#334155";
                ctx.fillRect(510, y, 68, 4);
            }

            // Pine Trees
            trees.forEach(t => {
                // Tree Trunk
                ctx.fillStyle = "#2d1e18";
                ctx.fillRect(t.x + 14, t.y + 24, 8, 16);
                // Green Pine Needles with Snow
                ctx.fillStyle = "#11221b";
                ctx.beginPath();
                ctx.moveTo(t.x + 18, t.y);
                ctx.lineTo(t.x + 36, t.y + 28);
                ctx.lineTo(t.x, t.y + 28);
                ctx.fill();
                // Snow on branches
                ctx.fillStyle = "#e2e8f0";
                ctx.fillRect(t.x + 4, t.y + 24, 28, 3);
                ctx.fillRect(t.x + 8, t.y + 14, 20, 3);
            });

            // Draw World Objects
            worldObjects.forEach(obj => {
                if (obj.type === 'cabin') {
                    // Log Cabin
                    ctx.fillStyle = "#3e2723";
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    // Roof
                    ctx.fillStyle = "#271b18";
                    ctx.fillRect(obj.x - 10, obj.y - 12, obj.w + 20, 16);
                    // Door
                    ctx.fillStyle = "#1a120f";
                    ctx.fillRect(obj.door.x, obj.door.y, obj.door.w, obj.door.h);
                    // Glowing Window
                    ctx.fillStyle = player.has_lantern ? "#fbbf24" : "#1e293b";
                    ctx.fillRect(obj.x + 18, obj.y + 25, 24, 24);
                } else if (obj.type === 'sign') {
                    ctx.fillStyle = "#6d4c41";
                    ctx.fillRect(obj.x + 8, obj.y + 8, 8, 16);
                    ctx.fillStyle = "#8d6e63";
                    ctx.fillRect(obj.x, obj.y, 24, 12);
                } else if (obj.type === 'wheel') {
                    // Giant Iron Locomotive Wheel
                    ctx.fillStyle = "#64748b";
                    ctx.beginPath();
                    ctx.arc(obj.x + 22, obj.y + 22, 20, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#0f172a";
                    ctx.beginPath();
                    ctx.arc(obj.x + 22, obj.y + 22, 12, 0, Math.PI * 2);
                    ctx.fill();
                } else if (obj.type === 'grave') {
                    ctx.fillStyle = "#94a3b8";
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.fillStyle = "#f8fafc";
                    ctx.fillRect(obj.x + 12, obj.y + 6, 6, 16);
                    ctx.fillRect(obj.x + 6, obj.y + 10, 18, 5);
                }
            });

            // Draw Player Sprite (Undertale-style pixel wanderer with acoustic guitar)
            ctx.fillStyle = "#0284c7"; // Winter Parka
            ctx.fillRect(player.x, player.y + 6, player.w, 18);
            ctx.fillStyle = "#fed7aa"; // Face
            ctx.fillRect(player.x + 4, player.y, 12, 8);
            ctx.fillStyle = "#451a03"; // Hair
            ctx.fillRect(player.x + 2, player.y - 2, 16, 4);
            // Nylon Guitar slung across back
            ctx.fillStyle = "#d97706";
            ctx.fillRect(player.x + (player.dir === 'LEFT' ? 16 : -4), player.y + 4, 6, 18);
            ctx.fillStyle = "#fef08a"; // Guitar Neck
            ctx.fillRect(player.x + (player.dir === 'LEFT' ? 17 : -3), player.y - 2, 4, 8);

            // Overworld HUD (LV & HP)
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 14px 'Courier New', monospace";
            ctx.fillText(`FRISK / KURT   LV ${player.lv}`, 30, 465);
            ctx.fillText(`HP ${player.hp} / ${player.maxHp}`, 260, 465);
            ctx.fillStyle = "#ff0000";
            ctx.fillRect(380, 452, 60, 14);
            ctx.fillStyle = "#ffff00";
            ctx.fillRect(380, 452, (player.hp / player.maxHp) * 60, 14);
        }

        function drawBattle() {
            // Shake effect
            const sx = (Math.random() - 0.5) * battle.shake;
            const sy = (Math.random() - 0.5) * battle.shake;

            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Enemy: Ghost of the Lost Girl (Spectral White Silhouette)
            ctx.fillStyle = battle.enemyPacified ? "#fde047" : "#f8fafc";
            ctx.beginPath();
            ctx.arc(320 + sx, 90 + sy, 22, 0, Math.PI * 2); // Head
            ctx.fill();
            // Spectral Dress
            ctx.beginPath();
            ctx.moveTo(300 + sx, 112 + sy);
            ctx.lineTo(340 + sx, 112 + sy);
            ctx.lineTo(355 + sx, 175 + sy);
            ctx.lineTo(285 + sx, 175 + sy);
            ctx.closePath();
            ctx.fill();

            // Enemy Name & Tag
            ctx.font = "bold 16px 'Courier New', monospace";
            ctx.fillStyle = battle.enemyPacified ? "#ffff00" : "#ffffff";
            ctx.fillText(battle.enemyPacified ? "* LOST GIRL (SPAREABLE)" : "* LOST GIRL", 230, 40);

            // The Undertale Battle Box (White Double Border)
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeRect(battle.box.x, battle.box.y, battle.box.w, battle.box.h);

            // Draw Soul (Red Heart)
            if (battle.turn === 'ENEMY') {
                ctx.fillStyle = "#ff0000";
                const hx = battle.soul.x;
                const hy = battle.soul.y;
                ctx.beginPath();
                ctx.moveTo(hx, hy - 4);
                ctx.bezierCurveTo(hx - 8, hy - 12, hx - 12, hy + 2, hx, hy + 9);
                ctx.bezierCurveTo(hx + 12, hy + 2, hx + 8, hy - 12, hx, hy - 4);
                ctx.fill();

                // Draw Bullets (Teardrops & Pine Needles)
                ctx.fillStyle = "#38bdf8";
                battle.bullets.forEach(b => {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Draw Timing Bar Strum Game
            else if (battle.turn === 'TIMING_BAR') {
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 3;
                ctx.strokeRect(battle.box.x + 10, battle.box.y + 40, battle.box.w - 20, 50);
                // Center target
                ctx.fillStyle = "#ffff00";
                ctx.fillRect(battle.box.x + battle.box.w / 2 - 12, battle.box.y + 40, 24, 50);
                // Moving Bar
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(battle.box.x + 10 + battle.timingBar.x, battle.box.y + 35, 8, 60);
                ctx.fillStyle = "#ffffff";
                ctx.font = "14px 'Courier New', monospace";
                ctx.fillText("PRESS [Z / ENTER] ON YELLOW TO STRUM CHORD!", battle.box.x + 10, battle.box.y + 120);
            }

            // Submenu Items (ACT / ITEM)
            if (battle.turn === 'PLAYER' && (battle.menu === 'ACT_SELECT' || battle.menu === 'ITEM_SELECT')) {
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 15px 'Courier New', monospace";
                battle.subOptions.forEach((opt, idx) => {
                    const y = battle.box.y + 30 + idx * 26;
                    if (idx === battle.selectedSub) {
                        ctx.fillStyle = "#ffff00";
                        ctx.fillText("> " + opt, battle.box.x + 20, y);
                    } else {
                        ctx.fillStyle = "#ffffff";
                        ctx.fillText("  " + opt, battle.box.x + 20, y);
                    }
                });
            }

            // Player HP & Stats Bar
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 15px 'Courier New', monospace";
            ctx.fillText(`HP  ${player.hp} / ${player.maxHp}`, 160, 390);
            ctx.fillStyle = "#ff0000";
            ctx.fillRect(270, 376, 80, 16);
            ctx.fillStyle = "#ffff00";
            ctx.fillRect(270, 376, (player.hp / player.maxHp) * 80, 16);

            // 4 Undertale Action Buttons: [ STRUM ] [ ACT ] [ ITEM ] [ MERCY ]
            const btnLabels = ["[ STRUM ]", "[ ACT ]", "[ ITEM ]", "[ MERCY ]"];
            const btnW = 120;
            const btnH = 38;
            const startX = 55;
            const startY = 415;

            btnLabels.forEach((label, idx) => {
                const bx = startX + idx * (btnW + 16);
                const isSelected = (battle.turn === 'PLAYER' && battle.menu === 'MAIN' && battle.selectedBtn === idx);

                ctx.strokeStyle = isSelected ? "#ff9900" : "#ff5500";
                ctx.lineWidth = 3;
                ctx.strokeRect(bx, startY, btnW, btnH);

                ctx.fillStyle = isSelected ? "#ffff00" : "#ff5500";
                ctx.font = "bold 16px 'Courier New', monospace";
                ctx.fillText(label, bx + 16, startY + 24);

                // Small Soul Heart on selected button
                if (isSelected) {
                    ctx.fillStyle = "#ff0000";
                    const hx = bx + 8;
                    const hy = startY + 18;
                    ctx.beginPath();
                    ctx.moveTo(hx, hy - 2);
                    ctx.bezierCurveTo(hx - 4, hy - 6, hx - 6, hy + 2, hx, hy + 6);
                    ctx.bezierCurveTo(hx + 6, hy + 2, hx + 4, hy - 6, hx, hy - 2);
                    ctx.fill();
                }
            });
        }

        function drawDialogueBox() {
            if (!dialogActive) return;

            // Box dimensions at bottom
            const bx = 35;
            const by = 310;
            const bw = 570;
            const bh = 145;

            ctx.fillStyle = "#000000";
            ctx.fillRect(bx, by, bw, bh);

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeRect(bx, by, bw, bh);

            // Dialogue Text
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px 'Courier New', monospace";

            const lines = currentTypedText.split('\n');
            lines.forEach((l, i) => {
                ctx.fillText(l, bx + 24, by + 34 + i * 26);
            });
        }

        // ==============================================================
        // 8. MAIN GAME LOOP
        // ==============================================================
        function gameLoop() {
            updateDialogue();

            if (gameMode === 'OVERWORLD') {
                updateOverworld();
                drawOverworld();
            } else if (gameMode === 'BATTLE') {
                updateBattle();
                drawBattle();
            }

            drawDialogueBox();

            requestAnimationFrame(gameLoop);
        }

        window.onload = () => {
            showDialogue([
                "* 03:17 AM. You stand in the snowy mountain pass.",
                "* Slung across your back is a nylon-string acoustic guitar.",
                "* The wind carries a ragged whisper: 'Where did you sleep last night?'",
                "* Use [ARROW KEYS / WASD] to explore, [Z / ENTER] to inspect."
            ]);
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
